<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的个人主页</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    min-height: 100vh;
    display: grid;
    grid-template-columns: 1fr;
    grid-template-rows: 60px 1fr auto 50px;
    grid-template-areas:
      "nav"
      "hero"
      "cards"
      "footer";
    font-family: "Microsoft YaHei", sans-serif;
    color: #333;
  }

  /* ===== 导航栏 ===== */
  nav {
    grid-area: nav;
    background: #2a6e9f;
    color: white;
    display: flex;              /* ← Flexbox！管内部横排 */
    align-items: center;
    justify-content: space-between;
    padding: 0 24px;
  }
  nav .logo {
    font-size: 18px;
    font-weight: bold;
  }
  nav ul {
    display: flex;              /* ← Flexbox 横排链接 */
    list-style: none;
    gap: 20px;
  }
  nav ul a {
    color: white;
    text-decoration: none;
    font-size: 14px;
  }
  nav .btn {
    background: #e67e22;
    padding: 6px 14px;
    border-radius: 4px;
    color: white;
    text-decoration: none;
    font-size: 14px;
  }

  /* ===== Hero 区 ===== */
  .hero {
    grid-area: hero;
    background: linear-gradient(135deg, #eaf4fa, #cfe6f3);
    display: flex;              /* ← Flexbox 居中内容 */
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 40px 20px;
    gap: 16px;
  }
  .hero h1 {
    font-size: 36px;
    color: #2a6e9f;
  }
  .hero p {
    font-size: 18px;
    color: #555;
  }
  .hero .cta {
    background: #2a6e9f;
    color: white;
    padding: 12px 28px;
    border-radius: 6px;
    text-decoration: none;
    font-size: 16px;
    margin-top: 8px;
  }

  /* ===== 三张卡片 ===== */
  .cards {
    grid-area: cards;
    padding: 32px 24px;
    display: grid;              /* ← Grid 又来了！管卡片墙 */
    grid-template-columns: repeat(4, 1fr);
    gap: 20px;
    max-width: 900px;
    margin: 0 auto;
    width: 100%;
  }
  .card {
    background: white;
    border: 1px solid #cfe6f3;
    border-radius: 8px;
    padding: 24px;
    text-align: center;
    display: flex;              /* ← Flexbox 内部竖排 */
    flex-direction: column;
    gap: 10px;
  }
  .card .icon { font-size: 32px; }
  .card h3 { color: #2a6e9f; }
  .card p { color: #666; font-size: 14px; }

  /* ===== 底部 ===== */
  footer {
    grid-area: footer;
    background: #333;
    color: #ccc;
    display: flex;              /* ← Flexbox 居中文字 */
    align-items: center;
    justify-content: center;
    font-size: 13px;
  }

  /* ===== 手机适配 ===== */
  @media (max-width: 600px) {
    .cards {
      grid-template-columns: 1fr;  /* 手机上卡片变单列 */
    }
    nav ul {
      display: none;               /* 手机上隐藏导航链接 */
    }
  }
</style>
</head>
<body>

  <nav>
    <div class="logo">🧑 张三</div>
    <ul>
      <li><a href=" ">首页</a ></li>
      <li><a href="#">作品</a ></li>
      <li><a href="#">关于</a ></li>
    </ul>
    <a href="#" class="btn">联系我</a >
  </nav>

  <section class="hero">
    <h1>你好，我是张三</h1>
    <p>前端学习者 · CSS 爱好者 · 正在用 Grid 搭建世界</p >
    <a href="#" class="cta">查看我的作品</a >
  </section>

  <section class="cards">
    <div class="card">
      <div class="icon">📱</div>
      <h3>响应式设计</h3>
      <p>用 Grid 和 Flexbox 让页面在任何屏幕上都能完美显示。</p >
    </div>
    <div class="card">
      <div class="icon">⚡</div>
      <h3>快速加载</h3>
      <p>纯 HTML + CSS，没有臃肿框架，打开就是秒开。</p >
    </div>
    <div class="card">
      <div class="icon">🎨</div>
      <h3>美观排版</h3>
      <p>每一个像素都经过思考，不只是能用，还要好看。</p >
    </div>
    <div class="card">
       <div class="icon">⚡</div>
       <h3>快速加载</h3>
       <p>纯 HTML + CSS，没有臃肿框架，打开就是秒开。</p >
    </div>
  </section>

  <footer>
    © 2026 张三 · 用 ❤️ 和 Grid 构建
  </footer>

</body>
</html>
